services:
  db:
    image: postgres:17
    container_name: kidora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kidora
    ports:
      - "5433:5432"
    volumes:
      - kidora_pgdata:/var/lib/postgresql/data

volumes:
  kidora_pgdata:
