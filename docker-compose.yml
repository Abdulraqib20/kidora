services:
  db:
    image: postgres:17
    container_name: boda-hameed-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boda_hameed
    ports:
      - "5433:5432"
    volumes:
      - boda_hameed_pgdata:/var/lib/postgresql/data

volumes:
  boda_hameed_pgdata:
